name: CASA CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Install Times New Roman fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          echo 'msttcorefonts msttcorefonts/accepted-mscorefonts-eula boolean true' | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends cabextract wget fonts-liberation || true
          sudo apt-get install -y --no-install-recommends ttf-mscorefonts-installer || true
          mkdir -p "$HOME/.local/share/fonts/msttcorefonts" /tmp/mscorefonts
          sudo find /usr/share/fonts -type f \( -iname 'times.ttf' -o -iname 'timesbd.ttf' \) -exec cp {} "$HOME/.local/share/fonts/msttcorefonts/" \; || true
          if [ ! -s "$HOME/.local/share/fonts/msttcorefonts/times.ttf" ] || [ ! -s "$HOME/.local/share/fonts/msttcorefonts/timesbd.ttf" ]; then
            wget -q --retry-connrefused --tries=3 -O /tmp/mscorefonts/times32.exe https://downloads.sourceforge.net/corefonts/times32.exe || true
            wget -q --retry-connrefused --tries=3 -O /tmp/mscorefonts/timesbd32.exe https://downloads.sourceforge.net/corefonts/timesbd32.exe || true
            cabextract -q -F '*.TTF' -d /tmp/mscorefonts /tmp/mscorefonts/times32.exe /tmp/mscorefonts/timesbd32.exe || true
            find /tmp/mscorefonts -type f -iname 'times.ttf' -exec cp {} "$HOME/.local/share/fonts/msttcorefonts/times.ttf" \; || true
            find /tmp/mscorefonts -type f -iname 'timesbd.ttf' -exec cp {} "$HOME/.local/share/fonts/msttcorefonts/timesbd.ttf" \; || true
          fi
          if [ ! -s "$HOME/.local/share/fonts/msttcorefonts/times.ttf" ] || [ ! -s "$HOME/.local/share/fonts/msttcorefonts/timesbd.ttf" ]; then
            echo 'Microsoft font unavailable; use Liberation Serif files under Times New Roman contract for CI import'
            REGULAR=$(find /usr/share/fonts -type f -iname 'LiberationSerif-Regular.ttf' | head -1)
            BOLD=$(find /usr/share/fonts -type f -iname 'LiberationSerif-Bold.ttf' | head -1)
            test -s "$REGULAR"
            test -s "$BOLD"
            cp "$REGULAR" "$HOME/.local/share/fonts/msttcorefonts/times.ttf"
            cp "$BOLD" "$HOME/.local/share/fonts/msttcorefonts/timesbd.ttf"
          fi
          test -s "$HOME/.local/share/fonts/msttcorefonts/times.ttf"
          test -s "$HOME/.local/share/fonts/msttcorefonts/timesbd.ttf"
          fc-cache -f "$HOME/.local/share/fonts"
      - run: python -m py_compile server.py
      - run: python -m compileall -q . -x '^(data|uploads|exports|\.git|\.venv)/'
      - name: Import app
        run: python -c "import server; print(server.app.title)"
      - name: Secret/data guard
        run: |
          ! git ls-files | grep -E '(^|/)(data|uploads|exports)/|\.db$|\.sqlite|\.bak$|\.env$|\.key$'
          ! git grep -nE 'github_pat_|ghp_|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' -- ':(exclude).github/workflows/ci.yml'
      - name: Frontend syntax
        run: node --check public/app.js
